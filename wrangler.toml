name = "punchin-email"
main = "src/index.js"
compatibility_date = "2024-06-03"

# FORWARD_TO is intentionally NOT defined here. It is the personal destination
# inbox (PII) and the only address allowed to drive the relay, so it is kept out
# of version control and set as a secret instead:
#     wrangler secret put FORWARD_TO
#
# ⚠️ PRECEDENCE: these are DEFAULTS ONLY — KV WINS.
# ALLOWED_ALIASES, CONTACT_URL and the FORWARD_TO secret are the bootstrap values
# used until the admin UI saves something. Once a field is saved it lives in the
# `settings:v1` KV record, which `getSettings` layers OVER these vars with no
# expiry — so editing a value here and redeploying changes NOTHING for that
# field. Revoking an alias by deleting it below and redeploying will LOOK like it
# worked while the KV copy keeps accepting mail for it.
# To hand a field back to this file, clear it in the admin UI ("Reset to deploy
# default", i.e. DELETE /api/settings/<field>); the badge next to the field shows
# `saved` (KV) vs `default` (this file / secret).
[vars]
RELAY_DOMAIN    = "trackmytime.today"
# Comma-separated base local-parts that are allowed to forward. Anything else
# hitting the catch-all worker is rejected instead of forwarded.
ALLOWED_ALIASES = "abuse,cla,contact,cve,feedback,licensing,privacy"
# URL shown in the bounce when mail hits an unrecognized address. Point this at a
# real, existing page (defaults to https://<RELAY_DOMAIN> if unset). Repoint it to
# a dedicated /contact page once one exists.
CONTACT_URL     = "https://trackmytime.today"
# Cloudflare Access (admin UI auth). Fill both in from the Access application you
# create in front of this worker's URL — they are non-secret identifiers. While
# either is blank, the admin UI fails closed (returns 503) and only email runs.
#   ACCESS_AUD         — the application Audience (AUD) tag
#   ACCESS_TEAM_DOMAIN — your team domain, e.g. yourteam.cloudflareaccess.com
ACCESS_AUD         = "3ce4393d6c58c90bb667a8959ffc8eade42c64133a2c854cfd1c4806eef933a6"
ACCESS_TEAM_DOMAIN = "punchin-app.cloudflareaccess.com"

[[kv_namespaces]]
binding = "EMAIL_THREADS"
id      = "7578f30de4a44f97b1900d3fbd9ebf7e"

[[send_email]]
name = "EMAIL_SENDING"
