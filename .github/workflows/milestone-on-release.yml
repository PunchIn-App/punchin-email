# When a MINOR or MAJOR release is published (step 9 of the release ritual —
# `gh release create vX.Y.0`), create a matching milestone and assign every
# merged PR that doesn't yet have one.
#
# Milestones deliberately track MINOR/MAJOR version groupings only — a release
# tag's patch component must be 0 for a milestone to fire. PATCH (bug-fix)
# releases still publish + tag (releases fire on EVERY increment), but they do
# NOT get their own milestone: their PRs roll up into the NEXT minor/major
# milestone, so every PR is milestoned exactly once, at its minor/major grouping.
#
# "No milestone" then means "merged since the last minor/major release", because
# that release already milestoned everything up to its point. The sweep is
# additionally BOUNDED AT BOTH ENDS — to PRs merged after the previous
# MINOR/MAJOR release's tag commit and at or before THIS release's tag commit —
# so a one-time un-milestoned backlog (e.g. releases published before this
# workflow existed, or backfilled out of order) can neither all land in
# whichever release fires it first, nor drag later work into an older
# milestone. Both bounds use the tag's *commit* date, not the release publish
# time, which can be backfilled/batched and isn't a reliable boundary.
#
# Runs under ADD_TO_PROJECT_PAT (the default GITHUB_TOKEN is kept read-only). The
# PAT must grant Issues: read/write (create milestone + assign) and Contents:
# read (search) on the repo. The board's Milestone field mirrors automatically.
name: Milestone on release

on:
  release:
    types: [published]

permissions: {}

# Serialize per release tag, and NEVER cancel: this workflow creates a milestone
# and then writes it onto N pull requests. A cancelled run leaves that sweep
# half-applied, which the next run cannot detect (the PRs it already touched no
# longer match `no:milestone`). Queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  milestone:
    runs-on: ubuntu-latest
    # Paginating releases + search and updating each PR; minutes at worst.
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const rel = context.payload.release;
            const tag = rel.tag_name;

            // Milestones fire only on MINOR/MAJOR releases (patch component 0).
            // Patch releases still ship + tag, but their PRs roll into the next
            // minor/major milestone — so this workflow no-ops on a patch tag.
            const semver = (t) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(t || '');
              return m ? { major: +m[1], minor: +m[2], patch: +m[3] } : null;
            };
            const cur = semver(tag);
            if (!cur) { core.info(`Tag ${tag} is not vX.Y.Z — skipping milestone.`); return; }
            if (cur.patch !== 0) {
              core.info(`${tag} is a patch release — milestones fire only on minor/major. Skipping.`);
              return;
            }

            // Create the milestone (closed, dated to the release); reuse if it exists.
            let ms;
            try {
              ms = (await github.rest.issues.createMilestone({
                owner, repo, title: tag, state: 'closed',
                due_on: rel.published_at, description: `Released ${(rel.published_at || '').slice(0, 10)}`,
              })).data;
            } catch (e) {
              const all = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 });
              ms = all.find(m => m.title === tag);
            }
            if (!ms) { core.setFailed('Could not create or find the milestone'); return; }

            // Resolve a tag to the *commit* date it points at (annotated or lightweight).
            // Publish times can be batched/backfilled — the commit date is the only
            // stable boundary, so both ends of the sweep window use it.
            const tagCommitDate = async (tagName) => {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
              let sha = ref.data.object.sha;
              if (ref.data.object.type === 'tag') {
                sha = (await github.rest.git.getTag({ owner, repo, tag_sha: sha })).data.object.sha;
              }
              return (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.committer.date;
            };

            // Lower bound = the previous MINOR/MAJOR release (the last milestone-bearing
            // one). Bounding to the previous patch tag would drop the intervening patch
            // PRs; the previous minor/major sweeps them all in.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const thisPub = new Date(rel.published_at || Date.now());
            const prev = releases
              .filter(r => r.id !== rel.id && r.published_at && new Date(r.published_at) < thisPub)
              .filter(r => { const p = semver(r.tag_name); return p && p.patch === 0; })
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at))[0];
            let since = null;
            if (prev) {
              try {
                since = await tagCommitDate(prev.tag_name);
              } catch (e) { core.warning(`prev-tag date (${prev.tag_name}): ${e.message}`); }
            }

            // UPPER bound = THIS release's own tag commit. Without it the sweep is
            // open-ended and every PR merged AFTER this tag (i.e. work belonging to a
            // later release) is dragged into this milestone — which is exactly what
            // happens when older releases are published/backfilled out of order. If the
            // tag can't be resolved we fail rather than sweep unbounded: a wrongly
            // milestoned backlog is tedious to undo, a failed job is a re-run.
            let until = null;
            try {
              until = await tagCommitDate(tag);
            } catch (e) {
              core.setFailed(`Could not resolve the commit date of ${tag} (${e.message}); refusing to sweep with no upper bound.`);
              return;
            }

            // Assign every merged PR with no milestone, BOUNDED to the window
            // (previous minor/major tag commit, this tag commit]. `*` is GitHub search's
            // open-ended range marker, used when there is no earlier minor/major release.
            const q = `repo:${owner}/${repo} is:pr is:merged no:milestone merged:${since || '*'}..${until}`;
            const prs = await github.paginate(github.rest.search.issuesAndPullRequests, { q, per_page: 100 });
            let n = 0;
            for (const pr of prs) {
              await github.rest.issues.update({ owner, repo, issue_number: pr.number, milestone: ms.number })
                .then(() => n++)
                .catch(e => core.warning(`#${pr.number}: ${e.message}`));
            }
            core.info(`Milestone ${tag} (#${ms.number}): assigned ${n} merged PR(s)`);
